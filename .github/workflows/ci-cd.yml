name: clearPanel CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: "CI - Test & Build Verification"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Build & Unit Tests
      - name: 🔧 Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 🧪 Run Backend Unit Tests
        working-directory: backend
        run: npm test

      - name: 🏗️ Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      # Frontend Build Verification
      - name: 🔧 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: 🎨 Build React Frontend (Vite)
        working-directory: frontend
        run: npm run build

  deploy-to-vps:
    name: "CD - Deploy clearPanel to VPS"
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for SSH Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || ( [ -z "${{ secrets.SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ] ); then
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SSH_HOST and either SSH_KEY or SSH_PASSWORD secret must be set in GitHub repository settings."
            echo "ℹ️ To enable automated deployment, add SSH_HOST, SSH_USER, and SSH_KEY (or SSH_PASSWORD) in Settings > Secrets and variables > Actions."
          else
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: "SSH into VPS & Update clearPanel"
        if: steps.check-secrets.outputs.secrets_configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.DEPLOY_PATH || '/opt/clearpanel' }}"
            echo "==> Updating clearPanel in: ${TARGET_DIR}"
            
            if [ ! -d "${TARGET_DIR}" ]; then
              echo "Directory ${TARGET_DIR} does not exist. Creating..."
              mkdir -p "${TARGET_DIR}"
              git clone https://github.com/${{ github.repository }}.git "${TARGET_DIR}"
            fi

            cd "${TARGET_DIR}"
            
            echo "==> Cleaning local working copy and syncing to remote main..."
            git fetch origin main
            git checkout -f main 2>/dev/null || true
            git reset --hard origin/main
            git clean -fd

            # Stop any orphan docker containers if created during previous docker attempt
            docker stop clearpanel 2>/dev/null || true
            docker rm clearpanel 2>/dev/null || true

            echo "==> Running production update.sh..."
            chmod +x update.sh
            ./update.sh
            
            echo "==> Verifying clearPanel systemd service..."
            if systemctl is-active --quiet clearpanel; then
              echo "✅ clearPanel service is active and running!"
              systemctl status clearpanel --no-pager -l
            else
              echo "❌ clearPanel service failed to start."
              journalctl -u clearpanel -n 50 --no-pager
              exit 1
            fi
